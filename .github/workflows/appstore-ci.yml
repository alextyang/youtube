name: App Store CI

on:
  pull_request:
    branches: [appstore]
  push:
    branches: [appstore]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appstore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test, audit, package, and compile
        run: ./scripts/appstore/ci.sh "$RUNNER_TEMP/appstore-artifact"

      - name: Preserve Safari package and generated project
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: improvedtube-appstore-${{ github.sha }}
          path: ${{ runner.temp }}/appstore-artifact
          if-no-files-found: error
          retention-days: 14
