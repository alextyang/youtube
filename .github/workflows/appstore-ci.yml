name: App Store CI

on:
  pull_request:
    branches: [appstore]
  push:
    branches: [appstore]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appstore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test, audit, package, and compile
        run: ./scripts/appstore/ci.sh "$RUNNER_TEMP/appstore-artifact"

      - name: Preserve Safari package and generated project
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: improvedtube-appstore-${{ github.sha }}
          path: ${{ runner.temp }}/appstore-artifact
          if-no-files-found: error
          retention-days: 14
