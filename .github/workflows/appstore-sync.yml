name: App Store upstream sync

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: appstore-upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out publisher branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: appstore
          fetch-depth: 0

      - name: Merge upstream into a review branch
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/code-charity/youtube.git
          git fetch upstream master --prune

          UPSTREAM_SHA=$(git rev-parse upstream/master)
          SHORT_SHA=${UPSTREAM_SHA:0:12}
          SYNC_BRANCH="automation/appstore-upstream-${SHORT_SHA}"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$SYNC_BRANCH" --json number --jq 'length > 0' | grep -q true; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$SYNC_BRANCH"
          git merge --no-edit upstream/master

          git checkout origin/appstore -- \
            .appstore \
            .github/workflows/appstore-ci.yml \
            .github/workflows/appstore-release.yml \
            .github/workflows/appstore-sync.yml \
            scripts/appstore

          ./scripts/appstore/verify.py
          git push --force-with-lease origin "HEAD:refs/heads/$SYNC_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open review pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ steps.sync.outputs.sync_branch }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base appstore \
            --head "$SYNC_BRANCH" \
            --title "chore(appstore): sync upstream ${UPSTREAM_SHA:0:12}" \
            --body "Automated upstream proposal for code-charity/youtube@${UPSTREAM_SHA}. App Store CI must pass and a publisher must review this PR before merge. This workflow never uploads to App Store Connect."
