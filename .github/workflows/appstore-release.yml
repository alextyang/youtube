# Publisher-owned workflow; signing secrets exist only in the protected environment.
name: App Store release

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Three-part App Store version, for example 4.1322.0
        required: true
        type: string
      build_number:
        description: New integer build number greater than the last uploaded build
        required: true
        type: string
      upload_to_app_store:
        description: Upload to App Store Connect after protected-environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: appstore-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Require the protected publisher branch
        if: github.ref_name != 'appstore'
        run: |
          echo "Run releases only from the appstore branch" >&2
          exit 1

      - name: Check out exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          ./scripts/appstore/verify.py \
            --marketing-version "$MARKETING_VERSION" \
            --build-number "$BUILD_NUMBER"

      - name: Test, audit, package, and compile
        run: ./scripts/appstore/ci.sh "$RUNNER_TEMP/appstore-artifact"

      - name: Preserve exact generated project
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: appstore-project-${{ github.sha }}
          path: ${{ runner.temp }}/appstore-artifact
          if-no-files-found: error
          retention-days: 30

  upload:
    if: inputs.upload_to_app_store
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    environment:
      name: app-store-production
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download exact generated project
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: appstore-project-${{ github.sha }}
          path: ${{ runner.temp }}/appstore-artifact

      - name: Archive, validate, and upload
        id: upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          ./scripts/appstore/upload.sh \
            "$RUNNER_TEMP/appstore-artifact" \
            "$MARKETING_VERSION" \
            "$BUILD_NUMBER"

      - name: Preserve the uploaded Xcode archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ImprovedTube-${{ inputs.marketing_version }}-${{ inputs.build_number }}-xcarchive
          path: ${{ steps.upload.outputs.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 90
